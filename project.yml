name: proof
options:
  bundleIdPrefix: com.annenolte
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GENERATE_INFOPLIST_FILE: NO
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  proof:
    type: application
    platform: iOS
    sources:
      - path: proof
    resources: []
    info:
      path: proof/Resources/Info.plist
      properties:
        CFBundleDisplayName: proof
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
        NSCameraUsageDescription: proof uses the camera to film a walkthrough of your room so it can rebuild it in 3D and flag things a small child could reach.
        NSPhotoLibraryAddUsageDescription: proof saves your checklist and room images to your photo library when you ask it to.
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - Inter-Regular.ttf
          - Inter-Medium.ttf
          - Inter-SemiBold.ttf
          - Inter-Bold.ttf
          - InstrumentSans-Medium.ttf
          - InstrumentSans-SemiBold.ttf
          - InstrumentSans-Bold.ttf
        UIUserInterfaceStyle: Light
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.annenolte.proof
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  proofTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: proof
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.annenolte.proofTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  proof:
    build:
      targets:
        proof: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - proofTests
